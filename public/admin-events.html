<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#10171e" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#eef1f4" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="manifest" href="/manifest.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">

<body class="console planner-page">

    <main>

  </div>
  <script src="/event-planner.js" defer></script>
